{% extends 'home/layout.html' %}

{% block title %}最終課題 動画姿勢解析{% endblock %}

{% block content %}
<div class="content">
    <p class="content_title">動画姿勢解析</p>
</div>

<h1>動画アップロード</h1>
{% if error_message %}
    <p>{{ error_message|linebreaksbr }}</p>
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">アップロード</button>
</form>
{% endblock %}
